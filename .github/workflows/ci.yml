# Unit tests and boundary checks for every pull request and push to main. Uses no secrets, so it's
# safe to run on pull requests from forks (which still need approval to run, see docs/OPEN-SOURCE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, pinned to the exact commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tests and boundary checks
        run: scripts/test.sh
